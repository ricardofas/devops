name: AI PR Description

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  generate-pr-description:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build PR context
        id: context
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          git fetch origin "${BASE_REF}" --depth=1
          git diff --unified=1 "origin/${BASE_REF}...HEAD" > pr.diff || true

          {
            echo "files<<EOF"
            git diff --name-status "origin/${BASE_REF}...HEAD" || true
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "commits<<EOF"
            git log --format='- %s' "origin/${BASE_REF}...HEAD" | head -n 20 || true
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          python3 - <<'PY'
          import os

          max_bytes = 120000
          with open("pr.diff", "rb") as f:
              data = f.read(max_bytes)
          text = data.decode("utf-8", errors="replace")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("diff<<EOF\n")
              out.write(text)
              out.write("\nEOF\n")
          PY

      - name: Generate PR description with OpenAI
        id: openai
        shell: bash
        env:
          GIT_MODEL_APIKEY: ${{ secrets.GIT_MODEL_APIKEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          CHANGED_FILES: ${{ steps.context.outputs.files }}
          COMMITS: ${{ steps.context.outputs.commits }}
          DIFF: ${{ steps.context.outputs.diff }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os

          prompt = f"""
          You are generating a professional GitHub pull request description.

          Pull request metadata:
          - PR number: {os.environ['PR_NUMBER']}
          - Title: {os.environ['PR_TITLE']}
          - Author: {os.environ['PR_AUTHOR']}
          - Base branch: {os.environ['BASE_REF']}
          - Head branch: {os.environ['HEAD_REF']}

          Changed files:
          {os.environ['CHANGED_FILES']}

          Commit messages:
          {os.environ['COMMITS']}

          Diff excerpt:
          {os.environ['DIFF']}

          Instructions:
          - Write concise, accurate markdown only.
          - Do not invent changes not supported by the diff or filenames.
          - Focus on intent and impact, not every line.
          - If evidence is weak, say "Based on the diff, ..." or "Likely ...".
          - Prefer DevOps-aware wording when relevant, e.g. workflow, infra, Kubernetes, Helm, Terraform, monitoring.
          - Output exactly these sections:

          ## Summary
          2-4 bullets explaining what changed and why.

          ## Changes
          Bullet list of the major code/config/doc changes.

          ## Risk
          One short paragraph with Low, Medium, or High and a reason.

          ## Testing
          Bullet list of suggested validation steps based on the changed files.

          ## Notes
          Optional bullets for deployment, rollback, secrets, migrations, observability, or follow-up actions. If none, write "- None."
          """

          body = {
              "model": "gpt-4o",  # or "meta-llama/llama-3.2-90b-instruct", etc.
              "messages": [{"role": "user", "content": prompt}],
              "max_tokens": 1500,
              "temperature": 0.3
          }

          with open("openai-request.json", "w", encoding="utf-8") as f:
              json.dump(body, f)
          PY

          curl -sS https://api.openai.com/v1/responses \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${GIT_MODEL_APIKEY}" \
            -d @openai-request.json \
            -o openai-response.json

          python3 - <<'PY'
          import json
          import os
          import sys

          with open("openai-response.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          text = data.get("output_text", "").strip()

          if not text:
              print(json.dumps(data, indent=2))
              raise SystemExit("No output_text returned from OpenAI API")

          marker_start = "<!-- ai-pr-description:start -->"
          marker_end = "<!-- ai-pr-description:end -->"

          final_body = f"""{marker_start}
          {text}
          {marker_end}"""

          with open("pr_body.md", "w", encoding="utf-8") as f:
              f.write(final_body)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("body_path=pr_body.md\n")
          PY

      - name: Update pull request body
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('${{ steps.openai.outputs.body_path }}', 'utf8');

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              body
            });
